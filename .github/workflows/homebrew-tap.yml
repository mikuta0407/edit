name: Update Homebrew Tap

# Mirrors the latest non-pre-release release into the mikuta0407/homebrew-apps
# tap by regenerating Formula/edit.rb.
#
# Triggered after the "Release" workflow finishes (not on the `release` event):
# the release object is published *before* release.yml uploads its assets, so
# reacting to `released` races the upload. `workflow_run` fires once Release has
# fully completed, guaranteeing the assets exist.
#
# The target version is resolved with `gh release view` (the latest release),
# which excludes pre-releases — i.e. the latest non-rc release, exactly what the
# tap should track. `-rc.N` tags are therefore never published here.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (default: latest non-rc release)"
        required: false

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    # On workflow_run, only proceed when the Release run succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve tag & detect rc
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            # Latest release excludes pre-releases (the -rc.N tags).
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ -rc\.[0-9]+$ ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a release candidate; tap will not be updated."
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.meta.outputs.is_rc == 'false'
        uses: actions/checkout@v4
        with:
          repository: mikuta0407/homebrew-apps
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Generate formula
        if: steps.meta.outputs.is_rc == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/mikuta0407/edit/releases/download/${TAG}"
          mac_arm="edit-${TAG}-macos-arm64.tar.gz"
          lin_arm="edit-${TAG}-linux-arm64.tar.gz"
          lin_x64="edit-${TAG}-linux-amd64.tar.gz"
          tmp="$(mktemp -d)"
          for a in "$mac_arm" "$lin_arm" "$lin_x64"; do
            gh release download "$TAG" --repo mikuta0407/edit --pattern "$a" --dir "$tmp"
          done
          sha_mac_arm=$(sha256sum "$tmp/$mac_arm" | cut -d' ' -f1)
          sha_lin_arm=$(sha256sum "$tmp/$lin_arm" | cut -d' ' -f1)
          sha_lin_x64=$(sha256sum "$tmp/$lin_x64" | cut -d' ' -f1)
          mkdir -p tap/Formula
          cat > tap/Formula/edit.rb <<EOF
          class Edit < Formula
            desc "We all edit (mikuta0407 fork of Microsoft Edit)"
            homepage "https://github.com/mikuta0407/edit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/${mac_arm}"
                sha256 "${sha_mac_arm}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/${lin_arm}"
                sha256 "${sha_lin_arm}"
              end
              on_intel do
                url "${base}/${lin_x64}"
                sha256 "${sha_lin_x64}"
              end
            end

            def install
              bin.install "edit"
              doc.install "LICENSE", "README.md"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/edit --version")
            end
          end
          EOF

      - name: Commit & push to tap
        if: steps.meta.outputs.is_rc == 'false'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/edit.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "edit ${{ steps.meta.outputs.version }}"
            git push
          fi
